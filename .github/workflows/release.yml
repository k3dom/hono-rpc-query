name: Release
on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags and the version PR
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # Do not restore dependency caches in this privileged publishing job.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisories in dev-only tooling must not block a release: the published
      # package ships no runtime dependencies of its own.
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Create version PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
