name: Check
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '24'
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test --coverage

      - name: Build
        run: vp pack

      # The examples are independent projects, not members of the root workspace.
      # The client links the root library and imports the server's types.
      - name: Install pnpm for examples
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install example server dependencies
        working-directory: example/server
        run: pnpm install --frozen-lockfile

      - name: Typecheck example server
        working-directory: example/server
        run: pnpm run typecheck

      - name: Install example client dependencies
        working-directory: example/client
        run: pnpm install --frozen-lockfile

      - name: Build example client
        working-directory: example/client
        run: pnpm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-node-${{ github.run_id }}
          path: coverage/

  nix:
    name: Nix and workflow checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check flake, Nix formatting, Nix lint and workflow syntax
        run: nix flake check --no-update-lock-file --print-build-logs
