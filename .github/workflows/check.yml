name: Check
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test --coverage

      - name: Build
        run: vp pack

      # The examples are independent projects, not members of the root workspace.
      # The client links the root library and imports the server's types.
      - name: Install pnpm for examples
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install example server dependencies
        working-directory: example/server
        run: pnpm install --frozen-lockfile

      - name: Typecheck example server
        working-directory: example/server
        run: pnpm run typecheck

      - name: Install example client dependencies
        working-directory: example/client
        run: pnpm install --frozen-lockfile

      - name: Build example client
        working-directory: example/client
        run: pnpm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-node-${{ github.run_id }}
          path: coverage/

  nix:
    name: Nix and workflow checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Check flake, Nix formatting, Nix lint and workflow syntax
        run: nix flake check --no-update-lock-file --print-build-logs
